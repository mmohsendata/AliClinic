{% extends "base.html" %}
{% block title %}تغيير كلمة المرور{% endblock %}
{% block breadcrumb %}تغيير كلمة المرور{% endblock %}
{% block content %}
<div class="password-page">
  <section class="panel password-panel">
    <span class="brand-mark password-mark">A</span>
    <p class="eyebrow">خطوة مطلوبة لتأمين الحساب</p>
    <h1>غيّر كلمة المرور</h1>
    <p class="muted">اختر كلمة مرور جديدة من 12 حرفاً على الأقل للمتابعة إلى مساحة العمل.</p>
    <form method="post" class="form-stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>كلمة المرور الجديدة<input type="password" name="password" minlength="12" autocomplete="new-password" required autofocus></label>
      <label>تأكيد كلمة المرور<input type="password" name="confirm_password" minlength="12" autocomplete="new-password" required></label>
      <button class="button primary full" type="submit">حفظ كلمة المرور</button>
    </form>
  </section>
</div>
{% endblock %}
